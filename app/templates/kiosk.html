<!DOCTYPE html>
<html>
<head>
    <title>Einkaufsliste</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kiosk.css') }}">
</head>
<body>

    <div class="kiosk-wrapper">
        <div id="category-filter-bar" class="kiosk-filter-bar"></div>
        <div class="grid-container"></div>
    </div>

    <div class="button-container">
        <button id="update-recipes-button" class="button" onclick="loadRecipes()">↺</button>
    </div>

    <!-- Slot picker overlay -->
    <div id="slot-backdrop" class="slot-backdrop hidden" onclick="closeSlotPicker()"></div>
    <div id="slot-picker" class="slot-picker hidden">

        <!-- Always-visible header -->
        <div class="slot-picker-header">
            <span id="slot-picker-title" class="slot-picker-title"></span>
            <button class="slot-picker-close" onclick="closeSlotPicker()">✕</button>
        </div>

        <!-- Scrollable body -->
        <div class="slot-picker-body">
            <!-- Step 1: choose day -->
            <div id="slot-step-day">
                <div class="slot-step-label">Welcher Tag?</div>
                <div class="slot-day-grid" id="slot-day-grid"></div>
            </div>

            <!-- Step 2: choose meal -->
            <div id="slot-step-meal" style="display:none;">
                <div class="slot-step-label" id="slot-meal-label"></div>
                <div class="slot-meal-list" id="slot-meal-list"></div>
            </div>
        </div>

        <!-- Always-visible footer (back button) -->
        <div class="slot-picker-footer" id="slot-picker-footer" style="display:none;">
            <button class="slot-back-btn" onclick="slotBackToDay()">← Zurück</button>
        </div>

    </div>

    <script src="{{ url_for('static', filename='js/kiosk.js') }}"></script>
</body>
</html>
