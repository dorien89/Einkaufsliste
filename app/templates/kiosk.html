<!DOCTYPE html>
<html>
<head>
    <title>Einkaufsliste</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/kiosk.css') }}">
</head>
<body>
    

    <div class="kiosk-wrapper">
        <div id="category-filter-bar" class="kiosk-filter-bar"></div>
        <div class="grid-container">
            <!-- Kacheln werden hier dynamisch geladen -->
        </div>
    </div>

    <!-- Shopping List Overlay -->
    <div id="shopping-list-overlay" class="hidden">
        <div class="shopping-list-content">
            <h2>Einkaufsliste</h2>
            <ul id="shopping-list-items"></ul>
            <div class="carousel" id="carousel">
                <div class="carousel-nav">
                    <button class="carousel-arrow" id="carousel-prev" onclick="carouselPrev()">‹</button>
                    <div class="carousel-card" id="carousel-card"></div>
                    <button class="carousel-arrow" id="carousel-next" onclick="carouselNext()">›</button>
                </div>
                <div class="carousel-counter" id="carousel-counter"></div>
            </div>
            <button id="clear-list-button" onclick="clearShoppingList()">Liste leeren</button>
            <button id="export-list-button" onclick="goToShoppingList()">Einkaufsliste erstellen →</button>
            <button onclick="toggleShoppingList()">Schließen</button>
        </div>
    </div>
    
    <div class="button-container">
        <button id="shopping-list-button" class="button" onclick="toggleShoppingList()">List<span id="list-badge" class="hidden"></span></button>
        <button id="update-recipes-button" class="button" onclick="loadRecipes()">↺</button>
    </div>

    <script src="{{ url_for('static', filename='js/kiosk.js') }}"></script>
</body>
</html>
