{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/recipe_manage.css') }}">
{% endblock %}
{% block content %}
<div class="page-header-row" style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px;flex-wrap:wrap;">
    <h1 style="margin:0">Kategorien</h1>
    <a href="{{ url_for('recipe.list_recipes') }}" class="rm-btn rm-btn-cancel" style="text-decoration:none;min-height:0;padding:8px 14px;">← Rezepte</a>
</div>
<p class="mgmt-desc">Kategorien werden Rezepten zugewiesen. Löschen ist nur möglich, wenn kein Rezept diese Kategorie verwendet.</p>

<!-- Add form -->
<div style="display:flex;gap:8px;margin-bottom:20px;max-width:560px;">
    <input type="text" id="new-cat-name" placeholder="Neue Kategorie hinzufügen…"
        style="flex:1;min-width:0;padding:10px 14px;border:1px solid var(--app-border,#ddd);border-radius:8px;font-size:1rem;box-sizing:border-box;background:var(--app-surface,#fff);color:var(--app-text,#333);"
        onkeydown="if(event.key==='Enter') addCat()">
    <button onclick="addCat()" class="rm-btn rm-btn-save" style="min-height:0;padding:8px 14px;flex-shrink:0;">+ Hinzufügen</button>
</div>

<div id="cat-list">
    {% for category in categories %}
    <div class="ing-row cat-item" id="cat-{{ category.id }}">
        <div class="ing-row-main">
            <div class="cat-display">
                <span class="ing-row-name">{{ category.name }}</span>
            </div>
            <input type="text" class="cat-edit-input" value="{{ category.name }}" placeholder="Name"
                style="display:none;padding:8px 10px;border:1px solid var(--app-border,#ddd);border-radius:8px;font-size:0.95rem;box-sizing:border-box;background:var(--app-surface,#fff);color:var(--app-text,#333);width:100%;"
                onkeydown="if(event.key==='Enter') saveCat({{ category.id }})">
        </div>
        <div class="ing-row-actions cat-view-btns">
            <button class="ing-row-btn" title="Bearbeiten" onclick="editCat({{ category.id }})">✏️</button>
            <button class="ing-row-btn delete" title="Löschen" onclick="deleteCat({{ category.id }}, {{ category.name | tojson }})">🗑️</button>
        </div>
        <div class="cat-edit-btns" style="display:none;gap:6px;">
            <button class="rm-btn rm-btn-cancel" style="padding:8px 14px;font-size:0.85rem;min-height:0;" onclick="cancelCat({{ category.id }})">Abbrechen</button>
            <button class="rm-btn rm-btn-save" style="padding:8px 14px;font-size:0.85rem;min-height:0;" onclick="saveCat({{ category.id }})">Speichern</button>
        </div>
    </div>
    {% endfor %}
</div>

<!-- Confirm modal -->
<div class="rm-confirm-overlay" id="cat-confirm-modal">
    <div class="rm-confirm-card">
        <div class="rm-confirm-card-title" id="cat-confirm-title"></div>
        <div class="rm-confirm-card-msg" id="cat-confirm-message"></div>
        <div class="rm-confirm-card-btns">
            <button id="cat-confirm-cancel" class="rm-btn rm-btn-cancel" style="flex:1;">Abbrechen</button>
            <button id="cat-confirm-ok" class="rm-btn rm-btn-delete" style="flex:1;">Löschen</button>
        </div>
    </div>
</div>

<script>
function editCat(id) {
    const row = document.getElementById('cat-' + id);
    row.querySelector('.cat-display').style.display = 'none';
    row.querySelector('.cat-edit-input').style.display = '';
    row.querySelector('.cat-view-btns').style.display = 'none';
    row.querySelector('.cat-edit-btns').style.display = 'flex';
    row.querySelector('.cat-edit-input').focus();
}

function cancelCat(id) {
    const row = document.getElementById('cat-' + id);
    row.querySelector('.cat-edit-input').value = row.querySelector('.ing-row-name').textContent;
    row.querySelector('.cat-display').style.display = '';
    row.querySelector('.cat-edit-input').style.display = 'none';
    row.querySelector('.cat-view-btns').style.display = '';
    row.querySelector('.cat-edit-btns').style.display = 'none';
}

async function saveCat(id) {
    const row = document.getElementById('cat-' + id);
    const name = row.querySelector('.cat-edit-input').value.trim();
    if (!name) return;
    const res = await fetch('/api/categories/' + id, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });
    if (res.ok) {
        row.querySelector('.ing-row-name').textContent = name;
        cancelCat(id);
    } else {
        alert('Fehler beim Speichern.');
    }
}

function showCatConfirm(title, message, onConfirm) {
    const modal = document.getElementById('cat-confirm-modal');
    document.getElementById('cat-confirm-title').textContent = title;
    document.getElementById('cat-confirm-message').textContent = message;
    modal.style.display = 'flex';
    const ok = document.getElementById('cat-confirm-ok');
    const cancel = document.getElementById('cat-confirm-cancel');
    const cleanup = () => { modal.style.display = 'none'; ok.onclick = null; cancel.onclick = null; modal.onclick = null; };
    ok.onclick = () => { cleanup(); onConfirm(); };
    cancel.onclick = cleanup;
    modal.onclick = e => { if (e.target === modal) cleanup(); };
}

async function deleteCat(id, name) {
    showCatConfirm(
        'Kategorie löschen?',
        `"${name}" wirklich löschen? Möglich nur wenn kein Rezept diese Kategorie verwendet.`,
        async () => {
            const res = await fetch('/api/categories/' + id, { method: 'DELETE' });
            const data = await res.json();
            if (res.ok) {
                document.getElementById('cat-' + id).remove();
            } else {
                alert(data.error || 'Fehler beim Löschen.');
            }
        }
    );
}

async function addCat() {
    const nameEl = document.getElementById('new-cat-name');
    const name = nameEl.value.trim();
    if (!name) return;
    const res = await fetch('/api/categories', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name })
    });
    const data = await res.json();
    if (res.ok) {
        const div = document.createElement('div');
        div.className = 'ing-row cat-item';
        div.id = 'cat-' + data.id;
        const escapedName = name.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        const jsonName = JSON.stringify(name);
        div.innerHTML = `
            <div class="ing-row-main">
                <div class="cat-display"><span class="ing-row-name">${escapedName}</span></div>
                <input type="text" class="cat-edit-input" value="${escapedName}" placeholder="Name"
                    style="display:none;padding:8px 10px;border:1px solid var(--app-border,#ddd);border-radius:8px;font-size:0.95rem;box-sizing:border-box;background:var(--app-surface,#fff);color:var(--app-text,#333);width:100%;"
                    onkeydown="if(event.key==='Enter') saveCat(${data.id})">
            </div>
            <div class="ing-row-actions cat-view-btns">
                <button class="ing-row-btn" title="Bearbeiten" onclick="editCat(${data.id})">✏️</button>
                <button class="ing-row-btn delete" title="Löschen" onclick="deleteCat(${data.id}, ${jsonName})">🗑️</button>
            </div>
            <div class="cat-edit-btns" style="display:none;gap:6px;">
                <button class="rm-btn rm-btn-cancel" style="padding:8px 14px;font-size:0.85rem;min-height:0;" onclick="cancelCat(${data.id})">Abbrechen</button>
                <button class="rm-btn rm-btn-save" style="padding:8px 14px;font-size:0.85rem;min-height:0;" onclick="saveCat(${data.id})">Speichern</button>
            </div>`;
        document.getElementById('cat-list').appendChild(div);
        nameEl.value = '';
        nameEl.focus();
    } else {
        alert('Fehler: ' + (data.error || 'Unbekannt'));
    }
}
</script>
{% endblock %}
