{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/recipe_manage.css') }}">
{% endblock %}
{% block content %}
<div class="page-header-row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <h1 style="margin:0">Rezepte</h1>
    <div style="display:flex;gap:8px;">
        <a href="{{ url_for('recipe.recipe_bin') }}" class="rm-btn rm-btn-edit" style="text-decoration:none;padding:10px 16px;">🗑️</a>
        <a href="{{ url_for('recipe.manage_categories') }}" class="rm-btn rm-btn-edit" style="text-decoration:none;padding:10px 16px;">Kategorien</a>
        <a href="{{ url_for('recipe.manage_ingredients') }}" class="rm-btn rm-btn-edit" style="text-decoration:none;padding:10px 16px;">Zutaten</a>
        <button class="rm-btn rm-btn-edit" id="select-mode-btn" onclick="toggleSelectMode()">Auswählen</button>
    </div>
</div>
<div id="bulk-bar" style="display:none;position:sticky;top:0;z-index:100;background:#fff3f3;border-bottom:1px solid #ffcdd2;padding:10px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;">
    <span id="bulk-count" style="font-weight:600;color:#c62828;"></span>
    <div style="display:flex;gap:8px;">
        <button class="rm-btn rm-btn-delete" onclick="bulkDelete()">🗑️ Löschen</button>
        <button class="rm-btn rm-btn-cancel" onclick="toggleSelectMode()">Abbrechen</button>
    </div>
</div>
<div class="rm-container" id="rm-container">
    <!-- Left panel -->
    <div class="rm-list-panel">
        <div class="rm-list-search">
            <input type="text" id="rm-search" placeholder="Suchen..." oninput="filterList()">
        </div>
        <div class="rm-category-filter" id="rm-category-filter"></div>
        <div class="rm-scroll-track"><div id="rm-scroll-progress" class="rm-scroll-progress"></div></div>
        <div class="rm-list-count" id="rm-list-count"></div>
        <ul class="rm-list-items" id="rm-list-items"></ul>
        <button class="rm-list-add-btn" onclick="openAddForm()">+ Neues Rezept</button>
    </div>
    <!-- Right panel -->
    <div class="rm-detail-panel">
        <div class="rm-detail-content" id="rm-detail-content">
            <div class="rm-detail-empty">Wähle ein Rezept oder füge ein neues hinzu.</div>
        </div>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/recipe_manage.js') }}"></script>
{% endblock %}
