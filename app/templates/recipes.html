{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/recipe_manage.css') }}">
{% endblock %}
{% block content %}
<div class="page-header-row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
    <h1 style="margin:0">Rezepte</h1>
    <div class="rm-header-nav">
        <a href="{{ url_for('recipe.recipe_bin') }}" class="rm-btn rm-btn-edit" style="text-decoration:none;">🗑️</a>
        <a href="{{ url_for('recipe.manage_categories') }}" class="rm-btn rm-btn-edit" style="text-decoration:none;">Kategorien</a>
        <a href="{{ url_for('recipe.manage_ingredients') }}" class="rm-btn rm-btn-edit" style="text-decoration:none;">Zutaten</a>
    </div>
</div>
<div class="rm-container" id="rm-container">
    <!-- Left panel -->
    <div class="rm-list-panel">
        <div class="rm-list-search">
            <input type="text" id="rm-search" placeholder="Suchen..." oninput="filterList()">
        </div>
        <div class="rm-category-filter" id="rm-category-filter"></div>
        <div class="rm-scroll-track"><div id="rm-scroll-progress" class="rm-scroll-progress"></div></div>
        <div class="rm-list-toolbar">
            <div class="rm-list-count" id="rm-list-count"></div>
            <div style="display:flex;align-items:center;gap:6px;">
                <button class="rm-list-add-small" onclick="openAddForm()">＋ Neu</button>
                <button class="rm-select-toggle" id="select-mode-btn" onclick="toggleSelectMode()">Auswählen</button>
            </div>
        </div>
        <div id="bulk-bar" style="display:none;background:#fff3f3;border-bottom:1px solid #ffcdd2;padding:6px 10px;align-items:center;justify-content:space-between;gap:8px;box-sizing:border-box;width:100%;overflow:hidden;">
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:0.85rem;font-weight:600;color:#c62828;min-width:0;flex-shrink:1;">
                <input type="checkbox" id="select-all-cb" style="width:18px;height:18px;flex-shrink:0;" onchange="toggleSelectAll(this.checked)">
                <span id="bulk-count"></span>
            </label>
            <div style="display:flex;gap:6px;flex-shrink:0;">
                <button class="rm-btn rm-btn-delete" style="padding:6px 10px;font-size:0.85rem;min-height:0;" onclick="bulkDelete()">🗑️ Löschen</button>
                <button class="rm-btn rm-btn-cancel" style="padding:6px 10px;font-size:0.85rem;min-height:0;" onclick="toggleSelectMode()">Abbrechen</button>
            </div>
        </div>
        <ul class="rm-list-items" id="rm-list-items"></ul>
    </div>
    <!-- Right panel -->
    <div class="rm-detail-panel">
        <div class="rm-detail-content" id="rm-detail-content">
            <div class="rm-detail-empty">Wähle ein Rezept oder füge ein neues hinzu.</div>
        </div>
        <div class="rm-detail-footer" id="rm-detail-footer" style="display:none;"></div>
    </div>
</div>

<!-- Custom confirm modal -->
<div class="rm-confirm-overlay" id="rm-confirm-modal">
    <div class="rm-confirm-card">
        <div class="rm-confirm-card-title" id="rm-confirm-title"></div>
        <div class="rm-confirm-card-msg" id="rm-confirm-message"></div>
        <div class="rm-confirm-card-btns">
            <button id="rm-confirm-cancel" class="rm-btn rm-btn-cancel" style="flex:1;">Abbrechen</button>
            <button id="rm-confirm-ok" class="rm-btn" style="flex:1;"></button>
        </div>
    </div>
</div>
<!-- Quick-add to shopping list sheet -->
<div id="rm-cart-backdrop" onclick="closeCartSheet()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:700;"></div>
<div id="rm-cart-sheet" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--app-surface,#fff);border-radius:18px 18px 0 0;padding:20px 16px 40px;z-index:701;box-shadow:0 -4px 20px rgba(0,0,0,0.15);max-width:600px;margin:0 auto;">
    <div style="width:40px;height:4px;background:var(--app-border,#ddd);border-radius:2px;margin:0 auto 18px;"></div>
    <div style="font-weight:700;font-size:1rem;margin-bottom:4px;">Zur Einkaufsliste hinzufügen</div>
    <div id="rm-cart-recipe-name" style="font-size:0.88rem;color:var(--app-muted,#888);margin-bottom:18px;"></div>
    <div style="display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:22px;">
        <button onclick="cartDelta(-0.5)" style="background:rgba(0,0,0,0.07);border:none;border-radius:50%;width:40px;height:40px;font-size:1.3rem;cursor:pointer;color:#555;">−</button>
        <span id="rm-cart-servings" style="font-size:1.4rem;font-weight:700;min-width:80px;text-align:center;"></span>
        <button onclick="cartDelta(0.5)"  style="background:rgba(0,0,0,0.07);border:none;border-radius:50%;width:40px;height:40px;font-size:1.3rem;cursor:pointer;color:#555;">+</button>
    </div>
    <div style="display:flex;gap:10px;">
        <button onclick="confirmAddToCart()" style="flex:1;padding:14px;background:var(--app-accent,#28a745);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;">🛒 Hinzufügen</button>
        <button onclick="closeCartSheet()" style="flex:1;padding:14px;background:var(--app-border,#f5f5f5);border:none;border-radius:12px;font-size:1rem;color:var(--app-muted,#555);cursor:pointer;">Abbrechen</button>
    </div>
</div>

<!-- Ingredient quick-edit sheet -->
<div id="ing-edit-backdrop" onclick="closeIngEdit()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:700;"></div>
<div id="ing-edit-sheet" style="display:none;position:fixed;bottom:0;left:0;right:0;background:#fff;border-radius:18px 18px 0 0;padding:20px 16px 40px;z-index:701;box-shadow:0 -4px 20px rgba(0,0,0,0.15);max-width:600px;margin:0 auto;">
    <div style="width:40px;height:4px;background:#ddd;border-radius:2px;margin:0 auto 18px;"></div>
    <div style="font-weight:700;font-size:1rem;margin-bottom:16px;">Zutat bearbeiten</div>

    <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
            <label style="font-size:0.82rem;color:#888;display:block;margin-bottom:4px;">Name</label>
            <input id="ing-edit-name" type="text" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:1rem;box-sizing:border-box;">
        </div>
        <div>
            <label style="font-size:0.82rem;color:#888;display:block;margin-bottom:4px;">Standardeinheit</label>
            <input id="ing-edit-unit" type="text" placeholder="z.B. g, Stück, ml" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:1rem;box-sizing:border-box;">
        </div>
        <div>
            <label style="font-size:0.82rem;color:#888;display:block;margin-bottom:4px;">Kategorie</label>
            <select id="ing-edit-cat" style="width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;font-size:1rem;box-sizing:border-box;">
                {% for cat in ['Obst & Gemüse','Fleisch & Fisch','Milch & Käse','Brot & Backwaren','Tiefkühl','Konserven & Fertiggerichte','Nudeln, Reis & Hülsenfrüchte','Öle & Gewürze','Getränke','Sonstiges'] %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.95rem;">
            <input id="ing-edit-staple" type="checkbox" style="width:20px;height:20px;">
            Vorrat (immer zu Hause, erscheint separat in der Einkaufsliste)
        </label>
    </div>

    <div style="display:flex;gap:10px;margin-top:20px;">
        <button onclick="saveIngEdit()" style="flex:1;padding:14px;background:#28a745;color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;">Speichern</button>
        <button onclick="closeIngEdit()" style="flex:1;padding:14px;background:#f5f5f5;border:none;border-radius:12px;font-size:1rem;color:#555;cursor:pointer;">Abbrechen</button>
    </div>
</div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/recipe_manage.js') }}"></script>
{% endblock %}
