{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/recipe_manage.css') }}">
{% endblock %}
{% block content %}

<div class="page-header-row" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
    <h1 style="margin:0;">Zutaten</h1>
    <div style="display:flex;gap:8px;align-items:center;">
        <button class="rm-list-add-small" onclick="openSheet(null)">＋ Neu</button>
        <a href="{{ url_for('recipe.list_recipes') }}" class="rm-btn rm-btn-cancel" style="text-decoration:none;padding:8px 14px;min-height:0;">← Rezepte</a>
    </div>
</div>

<!-- Search -->
<input type="search" id="ing-search" placeholder="Suchen…" oninput="render()"
    style="width:100%;max-width:600px;padding:10px 14px;border:1px solid var(--app-border,#ddd);border-radius:8px;font-size:1rem;box-sizing:border-box;background:var(--app-surface,#fff);color:var(--app-text,#333);margin-bottom:10px;display:block;">

<!-- Filter pills -->
<div id="ing-filter-bar" style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;max-width:600px;"></div>

<!-- Count -->
<div id="ing-count" style="font-size:0.78rem;color:var(--app-muted,#aaa);margin-bottom:8px;max-width:600px;"></div>

<!-- List -->
<div id="ing-list"></div>

<!-- ── Edit / Add bottom sheet ───────────────────────── -->
<div id="ing-backdrop" onclick="closeSheet()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:700;"></div>
<div id="ing-sheet" style="display:none;position:fixed;bottom:0;left:0;right:0;background:var(--app-surface,#fff);border-radius:18px 18px 0 0;padding:20px 16px 40px;z-index:701;box-shadow:0 -4px 20px rgba(0,0,0,0.15);max-width:600px;margin:0 auto;">
    <div style="width:40px;height:4px;background:var(--app-border,#ddd);border-radius:2px;margin:0 auto 18px;"></div>
    <div style="font-weight:700;font-size:1rem;margin-bottom:16px;" id="ing-sheet-title">Zutat bearbeiten</div>
    <div style="display:flex;flex-direction:column;gap:12px;">
        <div>
            <label style="font-size:0.82rem;color:var(--app-muted,#888);display:block;margin-bottom:4px;">Name</label>
            <input id="ing-sheet-name" type="text"
                style="width:100%;padding:10px;border:1px solid var(--app-border,#ddd);border-radius:8px;font-size:1rem;box-sizing:border-box;background:var(--app-surface,#fff);color:var(--app-text,#333);">
        </div>
        <div>
            <label style="font-size:0.82rem;color:var(--app-muted,#888);display:block;margin-bottom:4px;">Standardeinheit</label>
            <input id="ing-sheet-unit" type="text" placeholder="z.B. g, Stück, ml"
                style="width:100%;padding:10px;border:1px solid var(--app-border,#ddd);border-radius:8px;font-size:1rem;box-sizing:border-box;background:var(--app-surface,#fff);color:var(--app-text,#333);">
        </div>
        <div>
            <label style="font-size:0.82rem;color:var(--app-muted,#888);display:block;margin-bottom:4px;">Kategorie (Supermarkt)</label>
            <select id="ing-sheet-cat"
                style="width:100%;padding:10px;border:1px solid var(--app-border,#ddd);border-radius:8px;font-size:1rem;box-sizing:border-box;background:var(--app-surface,#fff);color:var(--app-text,#333);">
                {% for cat in ['Obst & Gemüse','Fleisch & Fisch','Milch & Käse','Brot & Backwaren','Tiefkühl','Konserven & Fertiggerichte','Nudeln, Reis & Hülsenfrüchte','Öle & Gewürze','Getränke','Sonstiges'] %}
                <option value="{{ cat }}">{{ cat }}</option>
                {% endfor %}
            </select>
        </div>
        <label style="display:flex;align-items:center;gap:10px;cursor:pointer;font-size:0.95rem;color:var(--app-text,#333);">
            <input id="ing-sheet-staple" type="checkbox" style="width:20px;height:20px;">
            Vorrat (immer zu Hause — erscheint separat in der Einkaufsliste)
        </label>
    </div>
    <div style="display:flex;gap:10px;margin-top:20px;">
        <button onclick="saveSheet()" style="flex:1;padding:14px;background:var(--app-accent,#28a745);color:#fff;border:none;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;">Speichern</button>
        <button onclick="closeSheet()" style="flex:1;padding:14px;background:var(--app-border,#f5f5f5);border:none;border-radius:12px;font-size:1rem;color:var(--app-muted,#555);cursor:pointer;">Abbrechen</button>
    </div>
    <div id="ing-sheet-error" style="display:none;margin-top:10px;padding:8px 12px;border-radius:8px;font-size:0.85rem;background:#fff3f3;border:1px solid #ffcdd2;color:#c62828;"></div>
</div>

<script>
const SHOP_CATS = ['Obst & Gemüse','Fleisch & Fisch','Milch & Käse','Brot & Backwaren','Tiefkühl','Konserven & Fertiggerichte','Nudeln, Reis & Hülsenfrüchte','Öle & Gewürze','Getränke','Sonstiges'];

// Load all data server-side into JS
let allIngredients = [
    {% for i in ingredients %}
    { id: {{ i.id }}, name: {{ i.name | tojson }}, default_unit: {{ (i.default_unit or '') | tojson }}, is_staple: {{ 'true' if i.is_staple else 'false' }}, shop_category: {{ i.shop_category | tojson }} }{% if not loop.last %},{% endif %}
    {% endfor %}
];

let activeFilter = 'all'; // 'all' | 'vorrat' | shop_category_name
let sheetIngId = null;     // null = new ingredient

// ── Filter pills ─────────────────────────────────────
function renderFilterBar() {
    const bar = document.getElementById('ing-filter-bar');
    const usedCats = new Set(allIngredients.map(i => i.shop_category).filter(Boolean));
    const hasStaple = allIngredients.some(i => i.is_staple);

    const pills = [
        { key: 'all', label: 'Alle' },
        ...(hasStaple ? [{ key: 'vorrat', label: '● Vorrat' }] : []),
        ...SHOP_CATS.filter(c => usedCats.has(c)).map(c => ({ key: c, label: c }))
    ];

    bar.innerHTML = pills.map(p => `
        <button class="rm-cat-btn${activeFilter === p.key ? ' active' : ''}"
            data-filter="${esc(p.key)}">${esc(p.label)}</button>
    `).join('');
}

document.getElementById('ing-filter-bar').addEventListener('click', e => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    renderFilterBar();
    render();
});

// ── Filter logic ─────────────────────────────────────
function getFiltered() {
    const q = (document.getElementById('ing-search').value || '').toLowerCase().trim();
    return allIngredients.filter(i => {
        if (q && !i.name.toLowerCase().includes(q)) return false;
        if (activeFilter === 'vorrat') return i.is_staple;
        if (activeFilter !== 'all') return i.shop_category === activeFilter;
        return true;
    });
}

// ── Render list ───────────────────────────────────────
function esc(s) {
    return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
    const filtered = getFiltered();
    const countEl = document.getElementById('ing-count');
    countEl.textContent = filtered.length === allIngredients.length
        ? `${allIngredients.length} Zutaten`
        : `${filtered.length} von ${allIngredients.length}`;

    const container = document.getElementById('ing-list');
    if (!filtered.length) {
        container.innerHTML = '<div class="ing-empty">Keine Zutaten gefunden</div>';
        return;
    }

    // Group alphabetically
    const groups = {};
    filtered.forEach(i => {
        const letter = i.name[0].toUpperCase();
        if (!groups[letter]) groups[letter] = [];
        groups[letter].push(i);
    });

    let html = '';
    Object.keys(groups).sort().forEach(letter => {
        html += `<div class="ing-alpha-header">${letter}</div>`;
        groups[letter].forEach(i => {
            html += `
            <div class="ing-row" id="ing-row-${i.id}">
                <div class="ing-row-main">
                    <div class="ing-row-name">${esc(i.name)}</div>
                    <div class="ing-row-meta">
                        ${i.default_unit ? `<span class="ing-chip">${esc(i.default_unit)}</span>` : ''}
                        ${i.is_staple ? `<span class="ing-chip ing-chip-staple">Vorrat</span>` : ''}
                        ${i.shop_category && i.shop_category !== 'Sonstiges' ? `<span class="ing-chip">${esc(i.shop_category)}</span>` : ''}
                    </div>
                </div>
                <div class="ing-row-actions">
                    <button class="ing-row-btn" title="Bearbeiten" onclick="openSheet(${i.id})">✏️</button>
                    <button class="ing-row-btn delete" title="Löschen" onclick="deleteIng(${i.id}, ${JSON.stringify(i.name)})">🗑️</button>
                </div>
            </div>`;
        });
    });
    container.innerHTML = html;
}

// ── Bottom sheet ──────────────────────────────────────
function openSheet(id) {
    sheetIngId = id;
    const err = document.getElementById('ing-sheet-error');
    err.style.display = 'none';

    if (id === null) {
        document.getElementById('ing-sheet-title').textContent = 'Neue Zutat';
        document.getElementById('ing-sheet-name').value = '';
        document.getElementById('ing-sheet-unit').value = '';
        document.getElementById('ing-sheet-cat').value = 'Sonstiges';
        document.getElementById('ing-sheet-staple').checked = false;
    } else {
        const i = allIngredients.find(x => x.id === id);
        if (!i) return;
        document.getElementById('ing-sheet-title').textContent = 'Zutat bearbeiten';
        document.getElementById('ing-sheet-name').value = i.name;
        document.getElementById('ing-sheet-unit').value = i.default_unit;
        document.getElementById('ing-sheet-cat').value = i.shop_category || 'Sonstiges';
        document.getElementById('ing-sheet-staple').checked = i.is_staple;
    }

    document.getElementById('ing-backdrop').style.display = 'block';
    document.getElementById('ing-sheet').style.display = 'block';
    setTimeout(() => document.getElementById('ing-sheet-name').focus(), 80);
}

function closeSheet() {
    document.getElementById('ing-backdrop').style.display = 'none';
    document.getElementById('ing-sheet').style.display = 'none';
    sheetIngId = null;
}

async function saveSheet() {
    const name = document.getElementById('ing-sheet-name').value.trim();
    const errEl = document.getElementById('ing-sheet-error');
    errEl.style.display = 'none';
    if (!name) { errEl.textContent = 'Bitte einen Namen eingeben.'; errEl.style.display = 'block'; return; }

    const payload = {
        name,
        default_unit: document.getElementById('ing-sheet-unit').value.trim(),
        shop_category: document.getElementById('ing-sheet-cat').value,
        is_staple: document.getElementById('ing-sheet-staple').checked
    };

    try {
        let res, data;
        if (sheetIngId === null) {
            // Create: first POST to /api/ingredients, then PUT to set all fields
            res = await fetch('/api/ingredients', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name })
            });
            data = await res.json();
            if (!res.ok) { errEl.textContent = data.error || 'Fehler'; errEl.style.display = 'block'; return; }
            const newId = data.id;
            res = await fetch(`/api/ingredients/${newId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            data = await res.json();
            if (!res.ok) { errEl.textContent = data.error || 'Fehler'; errEl.style.display = 'block'; return; }
            allIngredients.push({ id: newId, ...payload });
            allIngredients.sort((a, b) => a.name.localeCompare(b.name));
        } else {
            res = await fetch(`/api/ingredients/${sheetIngId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            data = await res.json();
            if (!res.ok) { errEl.textContent = data.error || 'Fehler'; errEl.style.display = 'block'; return; }
            const idx = allIngredients.findIndex(x => x.id === sheetIngId);
            if (idx !== -1) {
                allIngredients[idx] = { id: sheetIngId, ...payload };
                allIngredients.sort((a, b) => a.name.localeCompare(b.name));
            }
        }
        closeSheet();
        renderFilterBar();
        render();
    } catch (e) {
        errEl.textContent = 'Netzwerkfehler: ' + e.message;
        errEl.style.display = 'block';
    }
}

async function deleteIng(id, name) {
    if (!confirm(`"${name}" wirklich löschen?`)) return;
    const res = await fetch(`/api/ingredients/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (res.ok) {
        allIngredients = allIngredients.filter(i => i.id !== id);
        renderFilterBar();
        render();
    } else {
        alert(data.error || 'Fehler beim Löschen.');
    }
}

// Init
renderFilterBar();
render();
</script>
{% endblock %}
