<!DOCTYPE html>
<html>
<head>
    <title>Einkaufsliste</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav class="app-nav">
        <a href="{{ url_for('main.wochenplan') }}" class="nav-tab {% if request.path.startswith('/wochenplan') %}active{% endif %}">
            <span class="nav-icon">📅</span>
            <span class="nav-label">Planen</span>
        </a>
        <a href="{{ url_for('shopping-list.view_shopping_list') }}" class="nav-tab {% if request.path.startswith('/shopping-list') %}active{% endif %}">
            <span class="nav-icon">🛒</span>
            <span class="nav-label">Einkaufsliste</span>
        </a>
        <a href="{{ url_for('recipe.list_recipes') }}" class="nav-tab {% if request.path.startswith('/recipe') %}active{% endif %}">
            <span class="nav-icon">📖</span>
            <span class="nav-label">Rezepte</span>
        </a>
        <a href="{{ url_for('main.index') }}" class="nav-tab {% if request.path == '/' %}active{% endif %}">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Start</span>
        </a>
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
