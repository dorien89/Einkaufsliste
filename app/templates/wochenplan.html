{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/wochenplan.css') }}">
{% endblock %}
{% block content %}
<div id="wp-app">

    <div class="wp-week-nav">
        <button id="wp-prev" class="wp-nav-btn">‹</button>
        <span id="wp-week-label" class="wp-week-label"></span>
        <button id="wp-next" class="wp-nav-btn">›</button>
    </div>

    <div class="wp-day-tabs" id="wp-day-tabs"></div>

    <div class="wp-slots" id="wp-slots"></div>

    <div class="wp-footer">
        <button id="wp-to-list-btn" class="wp-to-list-btn">🛒 Zur Einkaufsliste hinzufügen</button>
        <button id="wp-clear-btn" class="wp-clear-btn">🗑️ Woche leeren</button>
    </div>
</div>

<!-- Recipe picker -->
<div id="wp-picker-backdrop" class="wp-picker-backdrop" style="display:none;"></div>
<div id="wp-picker" class="wp-picker" style="display:none;">
    <div class="wp-picker-header">
        <span class="wp-picker-title">Rezept wählen</span>
        <button onclick="closePicker()" class="wp-picker-close">✕</button>
    </div>
    <input id="wp-picker-search" type="search" placeholder="Rezept suchen…" class="wp-picker-search" oninput="filterPicker()">
    <div id="wp-picker-list" class="wp-picker-list"></div>
</div>

<div id="wp-toast" class="wp-toast" style="display:none;"></div>
{% endblock %}
{% block extra_js %}
<script src="{{ url_for('static', filename='js/wochenplan.js') }}"></script>
{% endblock %}
