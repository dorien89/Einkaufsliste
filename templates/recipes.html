<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezepte Liste</title>
    <link rel="stylesheet" href="/static/style.css"> <!-- Optional: CSS -->
    <style>
        body {
            font-family: 'Arial', sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f4;
            color: #333;
        }

        h1 {
            text-align: center;
            color: #444;
            margin-bottom: 20px;
        }

        ul {
            list-style-type: none;
            padding: 0;
            max-width: 100%;
            margin: 0 auto;
        }

        li {
            background: #ffffff;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 15px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .recipe-name {
            font-size: 1.2em;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        a, button {
            font-size: 1em;
            padding: 10px 20px;
            border-radius: 5px;
            text-align: center;
            color: #fff;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        a {
            background-color: #007BFF;
            text-decoration: none;
        }

        a:hover {
            background-color: #0056b3;
        }

        button {
            background-color: #FF6347;
            border: none;
        }

        button:hover {
            background-color: #FF4500;
        }

        .show-button {
            background-color: #28a745;
        }

        .show-button:hover {
            background-color: #218838;
        }

        .zutaten-details {
            display: none;
            margin-top: 10px;
            padding: 10px;
            background-color: #f1f1f1;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 100%;
        }

        .details-visible {
            display: block;
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        p a {
            color: #007BFF;
            text-decoration: none;
        }

        p a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Liste der Rezepte</h1>

    {% if rezepte %}
        <ul>
        {% for rezept in rezepte %}
            <li>
                <span class="recipe-name">{{ rezept[1] }}</span> (Kategorie: {{ rezept[2] }})
                <div class="actions">
                    <!-- Zutaten berechnen -->
                    <a href="{{ url_for('calculate_ingredients', rezept_id=rezept[0]) }}">Zutaten berechnen</a>

                    <!-- Rezept löschen -->
                    <form action="{{ url_for('delete_recipe', rezept_id=rezept[0]) }}" method="POST" style="display:inline;">
                        <button type="submit">Löschen</button>
                    </form>

                    <!-- Zutaten anzeigen -->
                    <button class="show-button" onclick="toggleZutaten({{ rezept[0] }})">Zutaten anzeigen</button>
                </div>
                <div id="zutaten-{{ rezept[0] }}" class="zutaten-details">
                    <!-- Zutaten werden hier angezeigt -->
                    <p>Loading ingredients...</p>
                </div>
            </li>
        {% endfor %}
        </ul>
        <p><a href="{{ url_for('add_recipe') }}">Rezept hinzufügen</a></p>
    {% else %}
        <p>Keine Rezepte gefunden. <a href="{{ url_for('add_recipe') }}">Rezept hinzufügen</a></p>
    {% endif %}

    <script>
        function toggleZutaten(rezeptId) {
            const detailsDiv = document.getElementById('zutaten-' + rezeptId);
            if (detailsDiv.classList.contains('details-visible')) {
                detailsDiv.classList.remove('details-visible');
            } else {
                detailsDiv.classList.add('details-visible');
                fetch(`/get_ingredients/${rezeptId}`)
                    .then(response => response.text())
                    .then(data => {
                        detailsDiv.innerHTML = data;
                    });
            }
        }
    </script>
</body>
</html>
