<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anzahl der Portionen</title>
    <link rel="stylesheet" href="/static/style.css"> <!-- Optional für Styling -->
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .portion-form {
            display: flex;
            flex-direction: column;
            max-width: 400px;
            margin: auto;
        }

        label {
            font-size: 1em;
            margin-bottom: 10px;
        }

        input[type="number"] {
            padding: 8px;
            font-size: 1em;
            margin-bottom: 20px;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            font-size: 1em;
            padding: 10px;
            background-color: #FF6347;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #FF4500;
        }
    </style>
</head>
<body>
    <h1>Portionen wählen</h1>
    <form action="{{ url_for('calculate_ingredients', rezept_id=rezept_id) }}" method="POST" class="portion-form">
        <label for="portions">Anzahl der Portionen:</label>
        <input type="number" id="portions" name="portions" min="1" value="1" required>
        <button type="submit">Berechnen</button>
    </form>
</body>
</html>
