<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            height: 95%;
            max-width: 1024px;
            max-height: 600px;
            background-color: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .grid-item {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            color: #333;
            padding: 10px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .grid-item:hover {
            background-color: #d4d4d4;
            transform: scale(1.05);
        }
        .grid-item.clicked {
            background-color: #b0b0b0; /* Farbe für den Klick-Effekt */
            border: 2px solid #333;
            transform: scale(1.1);
        }


        /* Button für die Einkaufsliste */
        #shopping-list-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 1000;
        }

        #shopping-list-button:hover {
            background-color: #0056b3;
        }

        /* Overlay für die Einkaufsliste */
        #shopping-list-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999; /* Aktiv sichtbar */
            opacity: 1;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .hidden {
            visibility: hidden; /* Unsichtbar */
            opacity: 0; /* Transparent */
            pointer-events: none; /* Klicks blockieren */
            z-index: -1; /* Entfernt es aus der Klick-Hierarchie */
        }


        .shopping-list-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        .shopping-list-content h2 {
            margin-top: 0;
        }

        .shopping-list-content ul {
            list-style: none;
            padding: 0;
        }

        .shopping-list-content button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .shopping-list-content button:hover {
            background-color: #0056b3;
        }

    </style>
</head>
<body>
    <div class="grid-container">
        <!-- Kacheln werden hier dynamisch geladen -->
    </div>

    <!-- Shopping List Overlay -->
    <div id="shopping-list-overlay" class="hidden">
        <div class="shopping-list-content">
            <h2>Einkaufsliste</h2>
            <ul id="shopping-list-items"></ul>
    
            <!-- Button zum Leeren der Einkaufsliste -->
            <button id="clear-list-button">Liste leeren</button>
    
            <!-- Weitere Buttons -->
            <button id="export-list-button">Liste exportieren</button>
    
            <!-- Schließen-Button -->
            <button onclick="toggleShoppingList()">Schließen</button>
        </div>
    </div>
    <button id="shopping-list-button" onclick="toggleShoppingList()">🛒</button>
    

    <!-- Ihr JavaScript -->
    <script>
        // JavaScript-Code hier einfügen
        let shoppingList = [];

        function toggleShoppingList() {
            const overlay = document.getElementById('shopping-list-overlay');
            
            if (overlay.classList.contains('hidden')) {
                overlay.classList.remove('hidden');
                console.log('Overlay geöffnet');
            } else {
                overlay.classList.add('hidden');
                console.log('Overlay geschlossen');
            }
        }


        function renderShoppingList() {
            const listElement = document.getElementById('shopping-list-items');
            listElement.innerHTML = ''; // Liste zurücksetzen

            shoppingList.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name;
                listElement.appendChild(li);
            });
        }


        function closeShoppingList() {
            const overlay = document.getElementById('shopping-list-overlay');
            overlay.classList.add('hidden'); // Nur schließen
            console.log('Overlay geschlossen');
        }


        async function loadRecipes() {
            try {
                const randomParam = `?nocache=${new Date().getTime()}`;
                const response = await fetch('/api/rezepte' + randomParam);
                const recipes = await response.json();
                const container = document.querySelector('.grid-container');

                container.innerHTML = '';

                recipes.forEach(recipe => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.textContent = recipe.name;
                    div.dataset.recipeId = recipe.id;

                    div.addEventListener('click', async () => {
                        console.log('Rezept-ID:', div.dataset.recipeId);
                        console.log('Rezept-Name:', recipe.name);

                        div.classList.add('clicked');
                        setTimeout(() => {
                            div.classList.remove('clicked');
                        }, 500);

                        shoppingList.push({ id: div.dataset.recipeId, name: recipe.name });
                        console.log('Aktuelle Einkaufsliste:', shoppingList);

                        try {
                            const portionen = 1;
                            const response = await fetch('/api/einkaufsliste', {
                                method: 'POST',
                                headers: {
                                    'Content-Type': 'application/json'
                                },
                                body: JSON.stringify({
                                    rezept_id: div.dataset.recipeId,
                                    portionen: portionen
                                })
                            });
                            if (!response.ok) {
                                console.error('Fehler beim Hinzufügen zur Einkaufsliste:', response.statusText);
                            }
                        } catch (error) {
                            console.error('Fehler beim Senden der Daten:', error);
                        }
                    });

                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Rezepte:', error);
            }
        }

        // Lade die Rezepte, sobald die Seite geladen ist
        window.onload = loadRecipes;
    </script>
</body>

</html>
