<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept App</title>
    <style>
        /* Unverändertes CSS aus deinem Code */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            height: 95%;
            max-width: 1024px;
            max-height: 600px;
            background-color: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .grid-item {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            color: #333;
            padding: 10px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .grid-item:hover {
            background-color: #d4d4d4;
            transform: scale(1.05);
        }
        .grid-item.clicked {
            background-color: #b0b0b0;
            border: 2px solid #333;
            transform: scale(1.1);
        }
        .button-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            gap: 20px;
        }
        .button {
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .button:hover {
            background-color: #0056b3;
        }
        #shopping-list-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 1;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        .shopping-list-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 700px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .shopping-list-content h2 {
            margin-top: 0;
        }
        .shopping-list-content ul {
            list-style: none;
            padding: 0;
        }
        .shopping-list-content button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .shopping-list-content button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <!-- Kacheln werden hier dynamisch geladen -->
    </div>

    <!-- Shopping List Overlay -->
    <div id="shopping-list-overlay" class="hidden">
        <div class="shopping-list-content">
            <h2>Einkaufsliste</h2>
            <ul id="shopping-list-items"></ul>
            <button id="clear-list-button" onclick="clearShoppingList()">Liste leeren</button>
            <button id="export-list-button" onclick="exportShoppingList()">Liste exportieren</button>
            <button onclick="toggleShoppingList()">Schließen</button>
        </div>
    </div>
    
    <div class="button-container">
        <button id="shopping-list-button" class="button" onclick="toggleShoppingList()">🛒</button>
        <button id="update-recipes-button" class="button" onclick="loadNewRecipes()">🔄</button>
    </div>

    <script>
        let shoppingList = [];

        function toggleShoppingList() {
            const overlay = document.getElementById('shopping-list-overlay');
            overlay.classList.toggle('hidden');
        }

        function addToShoppingList(recipeId, recipeName) {
            if (shoppingList.length >= 20) {
                alert('Die Einkaufsliste ist voll. Es können keine weiteren Rezepte hinzugefügt werden.');
                return;
            }

            const existingItem = shoppingList.find(item => item.id === recipeId);

            if (!existingItem) {
                shoppingList.push({ id: recipeId, name: recipeName, servings: 1 });
                console.log(`Rezept hinzugefügt: ${recipeName} (1 Portion)`);
            } else {
                existingItem.servings += 1;
                console.log(`Portionen erhöht für: ${recipeName} (jetzt ${existingItem.servings} Portionen)`);
            }

            renderShoppingList();
        }


        function renderShoppingList() {
            const listElement = document.getElementById('shopping-list-items');
            listElement.innerHTML = '';
            shoppingList.forEach(item => {
                const li = document.createElement('li');
                li.textContent = `${item.name} - ${item.servings} Portion(en)`;
                listElement.appendChild(li);
            });
        }

        function clearShoppingList() {
            shoppingList = [];
            renderShoppingList();
            console.log('Einkaufsliste geleert.');
        }

        function exportShoppingList() {
            if (shoppingList.length === 0) {
                console.log('Einkaufsliste ist leer. Nichts zu exportieren.');
                return;
            }

            fetch('/api/einkaufsliste', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ items: shoppingList })
            })
            .then(response => response.json())
            .then(data => {
                console.log('Einkaufsliste erfolgreich exportiert:', data);
                alert('Einkaufsliste wurde erfolgreich exportiert.');

                // Einkaufslisten-Array leeren
                shoppingList = [];
                renderShoppingList();
            })
            .catch(error => {
                console.error('Fehler beim Exportieren der Einkaufsliste:', error);
                alert('Fehler beim Exportieren der Einkaufsliste.');
            });
        }



        async function loadRecipes() {
            try {
                const randomParam = `?nocache=${Date.now()}`;
                const response = await fetch('/api/rezepte' + randomParam);
                const recipes = await response.json();
                const container = document.querySelector('.grid-container');
                container.innerHTML = '';

                recipes.forEach(recipe => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.textContent = recipe.name;
                    div.dataset.recipeId = recipe.id;

                    div.addEventListener('click', () => {
                        console.log('Rezept geklickt:', recipe.name);
                        addToShoppingList(recipe.id, recipe.name);
                        div.classList.add('clicked');
                        setTimeout(() => div.classList.remove('clicked'), 500);
                    });

                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Rezepte:', error);
            }
        }

        async function loadNewRecipes() {
            try {
                const randomParam = `?nocache=${Date.now()}`;
                const response = await fetch('/api/rezepte' + randomParam);
                const recipes = await response.json();
                const container = document.querySelector('.grid-container');
                container.innerHTML = '';

                recipes.forEach(recipe => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.textContent = recipe.name;
                    div.dataset.recipeId = recipe.id;

                    div.addEventListener('click', () => {
                        console.log('Rezept geklickt:', recipe.name);
                        addToShoppingList(recipe.id, recipe.name);
                        div.classList.add('clicked');
                        setTimeout(() => div.classList.remove('clicked'), 500);
                    });

                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Rezepte:', error);
            }
        }

        window.onload = loadRecipes;
    </script>
</body>
</html>
