<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept App</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            height: 95%;
            max-width: 1024px;
            max-height: 600px;
            background-color: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .grid-item {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            color: #333;
            padding: 10px;
        }
    </style>
    <script>
        async function loadRecipes() {
            try {
                // Füge einen Cache-Buster hinzu, um Caching zu vermeiden
                const randomParam = `?nocache=${new Date().getTime()}`;
                const response = await fetch('/api/rezepte' + randomParam);
                const recipes = await response.json();
                const container = document.querySelector('.grid-container');

                // Clear existing items
                container.innerHTML = '';

                // Add recipes to grid
                recipes.forEach(recipe => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.textContent = recipe.name;

                    // Füge die Rezept-ID als Datenattribut hinzu
                    div.dataset.recipeId = recipe.id;

                    // Optional: Event-Listener hinzufügen, um auf Klicks zu reagieren
                    div.addEventListener('click', () => {
                        console.log('Rezept-ID:', div.dataset.recipeId);
                        // Hier kannst du die ID für weitere Aktionen verwenden
                    });

                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Rezepte:', error);
            }
        }





        // Lade die Rezepte, sobald die Seite geladen ist
        window.onload = loadRecipes;
    </script>
</head>
<body>
    <div class="grid-container">
        <!-- Kacheln werden hier dynamisch geladen -->
    </div>
</body>
</html>
