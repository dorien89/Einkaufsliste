<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rezept App</title>
    <style>
        /* Unverändertes CSS aus deinem Code */
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f4f4f4;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            width: 95%;
            height: 95%;
            max-width: 1024px;
            max-height: 600px;
            background-color: #fff;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .grid-item {
            background-color: #e0e0e0;
            border: 1px solid #ccc;
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            font-size: 1em;
            font-weight: bold;
            color: #333;
            padding: 10px;
            transition: background-color 0.3s, transform 0.3s;
        }
        .grid-item:hover {
            background-color: #d4d4d4;
            transform: scale(1.05);
        }
        .grid-item.clicked {
            background-color: #b0b0b0;
            border: 2px solid #333;
            transform: scale(1.1);
        }
        #shopping-list-button {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 50%;
            width: 60px;
            height: 60px;
            font-size: 24px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            z-index: 1000;
        }
        #shopping-list-button:hover {
            background-color: #0056b3;
        }
        #shopping-list-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 1;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .hidden {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            z-index: -1;
        }
        .shopping-list-content {
            background-color: #fff;
            padding: 20px;
            border-radius: 8px;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
            text-align: center;
        }
        .shopping-list-content h2 {
            margin-top: 0;
        }
        .shopping-list-content ul {
            list-style: none;
            padding: 0;
        }
        .shopping-list-content button {
            margin-top: 20px;
            padding: 10px 20px;
            background-color: #007BFF;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .shopping-list-content button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="grid-container">
        <!-- Kacheln werden hier dynamisch geladen -->
    </div>

    <!-- Shopping List Overlay -->
    <div id="shopping-list-overlay" class="hidden">
        <div class="shopping-list-content">
            <h2>Einkaufsliste</h2>
            <ul id="shopping-list-items"></ul>
            <button id="clear-list-button" onclick="clearShoppingList()">Liste leeren</button>
            <button id="export-list-button" onclick="exportShoppingList()">Liste exportieren</button>
            <button onclick="toggleShoppingList()">Schließen</button>
        </div>
    </div>
    <button id="shopping-list-button" onclick="toggleShoppingList()">🛒</button>

    <script>
        let shoppingList = [];

        // Öffnen/Schließen des Overlays
        function toggleShoppingList() {
            const overlay = document.getElementById('shopping-list-overlay');
            overlay.classList.toggle('hidden');
        }

        // Einkaufsliste rendern
        function renderShoppingList() {
            const listElement = document.getElementById('shopping-list-items');
            listElement.innerHTML = '';
            shoppingList.forEach(item => {
                const li = document.createElement('li');
                li.textContent = item.name;
                listElement.appendChild(li);
            });
        }

        // Rezept zur Einkaufsliste hinzufügen
        function addToShoppingList(recipeId, recipeName) {
            if (!shoppingList.some(item => item.id === recipeId)) {
                shoppingList.push({ id: recipeId, name: recipeName });
                console.log(`Rezept hinzugefügt: ${recipeName}`);
                renderShoppingList();
            } else {
                console.log(`Rezept ist bereits in der Liste: ${recipeName}`);
            }
        }

        // Liste leeren
        function clearShoppingList() {
            shoppingList = [];
            renderShoppingList();
            console.log('Einkaufsliste geleert.');
        }

        // Liste exportieren
        function exportShoppingList() {
            if (shoppingList.length === 0) {
                console.log('Einkaufsliste ist leer. Nichts zu exportieren.');
                return;
            }
            const data = JSON.stringify(shoppingList, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'einkaufsliste.json';
            link.click();
            console.log('Einkaufsliste exportiert.');
        }

        // Rezepte laden und Kacheln erstellen
        async function loadRecipes() {
            try {
                const randomParam = `?nocache=${Date.now()}`;
                const response = await fetch('/api/rezepte' + randomParam);
                const recipes = await response.json();
                const container = document.querySelector('.grid-container');
                container.innerHTML = '';

                recipes.forEach(recipe => {
                    const div = document.createElement('div');
                    div.className = 'grid-item';
                    div.textContent = recipe.name;
                    div.dataset.recipeId = recipe.id;

                    // Klick-Event für Kacheln
                    div.addEventListener('click', () => {
                        console.log('Rezept geklickt:', recipe.name);
                        addToShoppingList(recipe.id, recipe.name);
                        div.classList.add('clicked');
                        setTimeout(() => div.classList.remove('clicked'), 500);
                    });

                    container.appendChild(div);
                });
            } catch (error) {
                console.error('Fehler beim Laden der Rezepte:', error);
            }
        }

        // Rezepte beim Laden der Seite abrufen
        window.onload = loadRecipes;
    </script>
</body>
</html>
